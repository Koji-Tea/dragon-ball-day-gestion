<body>
<div id="login" hidden>
  <form id="loginForm" class="card">
    <img class="logo" alt="Dragon Ball Day" src="img/logo.webp">
    <img class="goku" alt="" src="img/goku.webp">
    <h2 style="text-align:center">Connexion</h2>
    <div class="f"><label for="lgMail">E-mail</label><input id="lgMail" type="email" autocomplete="username" required></div>
    <div class="f"><label for="lgPass">Mot de passe</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
    <p id="lgErr" class="small" style="color:var(--bad);margin:0" hidden></p>
    <button class="btn primary">Se connecter</button>
    <button type="button" class="btn ghost sm" id="lgForgot">Mot de passe oublié</button>
  </form>
</div>

<div class="app">
  <nav class="side" id="side"></nav>
  <div style="min-width:0">
    <header class="top"><img alt="Dragon Ball Day" src="img/logo.webp"><span class="ttl" id="ttl"></span></header>
    <main id="main"><div class="loading"><img alt="Dragon Ball Day" src="img/logo.webp"><span>Rassemblement des boules de cristal…</span></div></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
